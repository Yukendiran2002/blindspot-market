# Render blueprint (not deployed yet). Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: blindspot-market
    runtime: docker
    plan: starter   # ~250 MB resident: embeddings are precomputed in data/, no model is loaded at runtime
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DAILY_LIMIT
        value: "300"
      - key: BLINDSPOT_OPERATOR_KEY
        generateValue: true
      - key: BLINDSPOT_INVITE
        sync: false
